server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:30079}
      password: ${REDIS_PASSWORD:your-redis-password}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service-auth
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/identity-service/auth/**
              filters:
                - RewritePath=/identity-service/(?<segment>.*), /$\{segment}

            - id: identity-service-user-create
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/identity-service/members, /identity-service/hosts
                - Method=POST
              filters:
                - RewritePath=/identity-service/(?<segment>.*), /$\{segment}

            - id: identity-service
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/identity-service/**
              filters:
                - RewritePath=/identity-service/(?<segment>.*), /$\{segment}
                - Authentication

            - id: accommodation-service
              uri: ${ACCOMMODATION_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/accommodation-service/**
              filters:
                - RewritePath=/accommodation-service/(?<segment>.*), /$\{segment}
                - Authentication

jwt:
  secret-key: ${JWT_SECRET_KEY:this-is-a-very-long-and-secure-secret-key-for-hs256-algorithm}
